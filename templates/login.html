{% extends "base.html" %}
{% block title %}Sign in | Precision Packaging{% endblock %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Sign in</h1>
  <p class="muted">Access the Precision Packaging Corner management system.</p>
  <form method="post">
    <label>Email address</label><input type="email" name="email" required autocomplete="username">
    <label>Password</label><input type="password" name="password" required autocomplete="current-password">
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
