{% extends "base.html" %}{% block title %}Add Product | Precision Packaging{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">INVENTORY SETUP</p><h1>Add Product</h1><p class="muted">Leave any unconfirmed price field blank.</p></div><a href="{{ url_for('products') }}">Back to catalogue</a></div>
<form class="panel form-grid" method="post"><div><label>Product code *</label><input name="sku" required placeholder="e.g. PPC-117"></div><div><label>Product name *</label><input name="product_name" required></div><div><label>Category *</label><input name="category" required placeholder="e.g. With Valve"></div><div><label>Bulk pack quantity (pieces)</label><input type="number" name="bulk_pack_size" min="1" value="50"></div><div><label>Recovery rate (UGX)</label><input type="number" name="recovery_rate_ugx" min="0" step="0.01"></div><div><label>Piece selling price (UGX)</label><input type="number" name="piece_selling_price_ugx" min="0" step="0.01"></div><div><label>Bulk-pack selling price (UGX)</label><input type="number" name="bulk_pack_price_ugx" min="0" step="0.01"></div><div class="full"><label>Notes / source description</label><input name="source_description"></div><div class="full"><button class="primary">Save product</button></div></form>{% endblock %}
